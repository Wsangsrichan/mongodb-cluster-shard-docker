# =============================================================================
# Prometheus Configuration — MongoDB Sharded Cluster (Multi-Host)
# =============================================================================
# Runs on Host 1. Scrapes all 9 MongoDB exporters across all 3 hosts.
# Exporters per host: port 9216 (configdb), 9217 (shard0), 9218 (shard1)
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "mongodb"
    metrics_path: /metrics
    static_configs:
      # Host 1 exporters (localhost)
      - targets:
          - localhost:9216
        labels:
          cluster: "mongo-sharded-cluster"
          component: "configdb"
          replica_set: "configdb"
          mongo_node: "configdb-replica0"
          host: "host1"

      - targets:
          - localhost:9217
        labels:
          cluster: "mongo-sharded-cluster"
          component: "shard"
          replica_set: "shard0"
          mongo_node: "shard0-replica0"
          host: "host1"

      - targets:
          - localhost:9218
        labels:
          cluster: "mongo-sharded-cluster"
          component: "shard"
          replica_set: "shard1"
          mongo_node: "shard1-replica1"
          host: "host1"

      # Host 2 exporters
      - targets:
          - ${HOST2_IP}:9216
        labels:
          cluster: "mongo-sharded-cluster"
          component: "configdb"
          replica_set: "configdb"
          mongo_node: "configdb-replica1"
          host: "host2"

      - targets:
          - ${HOST2_IP}:9217
        labels:
          cluster: "mongo-sharded-cluster"
          component: "shard"
          replica_set: "shard0"
          mongo_node: "shard0-replica1"
          host: "host2"

      - targets:
          - ${HOST2_IP}:9218
        labels:
          cluster: "mongo-sharded-cluster"
          component: "shard"
          replica_set: "shard1"
          mongo_node: "shard1-replica0"
          host: "host2"

      # Host 3 exporters
      - targets:
          - ${HOST3_IP}:9216
        labels:
          cluster: "mongo-sharded-cluster"
          component: "configdb"
          replica_set: "configdb"
          mongo_node: "configdb-replica2"
          host: "host3"

      - targets:
          - ${HOST3_IP}:9217
        labels:
          cluster: "mongo-sharded-cluster"
          component: "shard"
          replica_set: "shard0"
          mongo_node: "shard0-replica2"
          host: "host3"

      - targets:
          - ${HOST3_IP}:9218
        labels:
          cluster: "mongo-sharded-cluster"
          component: "shard"
          replica_set: "shard1"
          mongo_node: "shard1-replica2"
          host: "host3"

  - job_name: "node"
    static_configs:
      - targets:
          - localhost:9100
        labels:
          cluster: "mongo-sharded-cluster"
          host: "host1"
      - targets:
          - ${HOST2_IP}:9100
        labels:
          cluster: "mongo-sharded-cluster"
          host: "host2"
      - targets:
          - ${HOST3_IP}:9100
        labels:
          cluster: "mongo-sharded-cluster"
          host: "host3"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090
