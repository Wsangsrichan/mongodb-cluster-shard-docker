# =============================================================================
# HAProxy Configuration — TCP Load Balancer for Mongos Routers
# =============================================================================
# Runs on Host 3. Load balances between mongos-router0 (Host 1) and
# mongos-router1 (Host 2). Clients connect to Host 3:27017.
# =============================================================================

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    log global
    option tcplog

frontend mongos_frontend
    bind *:27017
    default_backend mongos_backend

backend mongos_backend
    balance roundrobin
    option tcp-check
    server mongos0 ${HOST1_IP}:27017 check
    server mongos1 ${HOST2_IP}:27017 check
